# -----------------------
# HTTP → HTTPS redirect
# -----------------------
server {
    listen 80;
    server_name software-dss.sajibsutradhar.dev;

    return 301 https://$host$request_uri;
}

# -----------------------
# HTTPS SERVER
# -----------------------
server {
    listen 443 ssl;
    server_name software-dss.sajibsutradhar.dev;

    ssl_certificate /etc/letsencrypt/live/software-dss.sajibsutradhar.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/software-dss.sajibsutradhar.dev/privkey.pem;

    # -----------------------
    # FRONTEND (Nuxt)
    # -----------------------
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------
    # BACKEND (FastAPI)
    # -----------------------
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}