server {
    listen 80;
    server_name software-dss.sajibsutradhar.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name software-dss.sajibsutradhar.dev;

    ssl_certificate /etc/letsencrypt/live/software-dss.sajibsutradhar.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/software-dss.sajibsutradhar.dev/privkey.pem;

    location / {
        proxy_pass http://app:3000;
    }

    location /api/ {
        proxy_pass http://api:8000/;
    }
}