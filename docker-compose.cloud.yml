services:
  api:
    image: sajibsd013/carbon-api
    restart: always
    env_file:
      - ./software_carbon_emissions_api/.env

  app:
    image: sajibsd013/carbon-app
    restart: always

  nginx:
    image: nginx:stable-alpine
    container_name: carbon_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
      - app