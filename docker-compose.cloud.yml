services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./certs:/etc/nginx/certs:ro
      - ./vhost:/etc/nginx/vhost.d
      - ./html:/usr/share/nginx/html

  letsencrypt:
    image: nginxproxy/acme-companion
    container_name: nginx-proxy-acme
    restart: always
    depends_on:
      - nginx-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/etc/nginx/certs
      - ./vhost:/etc/nginx/vhost.d
      - ./html:/usr/share/nginx/html

  app:
    image: sajibsd013/carbon-app
    restart: always
    environment:
      - VIRTUAL_HOST=software-dss.sajibsutradhar.dev
      - LETSENCRYPT_HOST=software-dss.sajibsutradhar.dev
      - LETSENCRYPT_EMAIL=your-email@gmail.com

  api:
    image: sajibsd013/carbon-api
    restart: always
    environment:
      - VIRTUAL_HOST=software-dss.sajibsutradhar.dev
      - VIRTUAL_PATH=/api
      - LETSENCRYPT_HOST=software-dss.sajibsutradhar.dev
      - LETSENCRYPT_EMAIL=your-email@gmail.com