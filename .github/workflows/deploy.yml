name: Build and Deploy

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build & Push API
      - name: Build API Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/carbon-api:latest \
            ./software_carbon_emissions_api

      - name: Push API Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/carbon-api:latest

      # Build & Push APP
      - name: Build APP Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/carbon-app:latest \
            ./software_carbon_emissions_app

      - name: Push APP Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/carbon-app:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            cd ~/software_carbon_emissions

            git pull origin master
            
            docker compose -f docker-compose.cloud.yml pull

            docker compose -f docker-compose.cloud.yml up -d --remove-orphans

            docker image prune -af