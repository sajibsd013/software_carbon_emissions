version: "3.9"

services:
  api:
    build:
      context: ./software_carbon_emissions_api
    container_name: carbon_api
    restart: always
    env_file:
      - ./software_carbon_emissions_api/.env
    environment:
      - PYTHONPATH=/app
    expose:
      - "8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  app:
    build:
      context: ./software_carbon_emissions_app
    container_name: carbon_app
    restart: always
    expose:
      - "3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - NODE_ENV=production
    command: sh -c "npm run build && npm run start"

  nginx:
    image: nginx:stable-alpine
    container_name: carbon_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
      - app